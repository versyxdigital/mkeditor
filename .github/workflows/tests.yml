name: CI
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  check:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run prettier-check
      - run: npm run lint
      - name: Unit and component tests (shuffled order)
        run: npm test -- --runInBand --randomize --showSeed
      # Build verification — catches webpack/tsc errors that lint and
      # unit tests miss (config drift, missing exports, broken dynamic
      # imports). build-editor bundles the renderer; build-app compiles
      # the Electron main process.
      - run: npm run build-editor
      - run: npm run build-app
